<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxPilot WebRTC Voice</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:1rem; }
.container { width:100%; max-width:480px; text-align:center; }
h1 { font-size:2rem; margin-bottom:.25rem; background:linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { color:#94a3b8; margin-bottom:1.5rem; font-size:.85rem; }

.auth-panel { background:#1e293b; border:1px solid #334155; border-radius:.75rem; padding:1.25rem; margin-bottom:1rem; text-align:left; }
.field { padding:.7rem; border-radius:.5rem; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:.85rem; width:100%; margin-bottom:.6rem; }
.field:focus { outline:none; border-color:#6366f1; }
.auth-row { display:flex; gap:.5rem; margin-top:.25rem; }
.btn { flex:1; padding:.65rem; border:none; border-radius:.5rem; font-size:.85rem; cursor:pointer; font-weight:600; }
.btn.primary { background:linear-gradient(135deg,#6366f1,#a855f7); color:white; }
.btn.ghost { background:transparent; border:1px solid #334155; color:#cbd5e1; }
.btn.small { flex:0 0 auto; padding:.35rem .7rem; font-size:.75rem; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.auth-msg { color:#fca5a5; font-size:.78rem; margin-top:.5rem; min-height:1rem; }

.user-row { display:flex; align-items:center; justify-content:center; gap:.75rem; margin-bottom:.75rem; }
.user-label { color:#94a3b8; font-size:.8rem; }

.status-bar { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:1rem; }
.status-dot { width:10px; height:10px; border-radius:50%; background:#475569; }
.status-dot.connected { background:#22c55e; }
.status-dot.listening { background:#3b82f6; animation:pulse .6s infinite; }
.status-dot.processing { background:#f59e0b; animation:pulse 1s infinite; }
.status-dot.speaking { background:#a855f7; }
.status-dot.idle { background:#22c55e; }
.status-dot.error { background:#ef4444; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.mic-btn { width:100px; height:100px; border-radius:50%; border:none; background:linear-gradient(135deg,#6366f1,#a855f7); color:white; font-size:2.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; box-shadow:0 4px 25px rgba(99,102,241,.3); transition:transform .15s,box-shadow .15s; }
.mic-btn:hover { transform:scale(1.05); box-shadow:0 4px 35px rgba(99,102,241,.5); }
.mic-btn.active { background:linear-gradient(135deg,#ef4444,#dc2626); box-shadow:0 4px 25px rgba(239,68,68,.4); animation:pulse 1s infinite; }
.mic-btn:disabled { opacity:.3; cursor:not-allowed; transform:none; }
.prompt { color:#94a3b8; font-size:.8rem; margin-bottom:1rem; min-height:1rem; }
.conversation { text-align:left; max-height:220px; overflow-y:auto; margin-bottom:.5rem; }
.bubble { padding:.55rem .75rem; border-radius:.5rem; margin:.35rem 0; font-size:.84rem; line-height:1.4; }
.bubble.user { background:#334155; }
.bubble.assistant { background:#1e3a5f; border-left:3px solid #6366f1; }
.bubble.transcript { background:#1e293b; border-left:3px solid #3b82f6; font-style:italic; }
.bubble.tool { background:#1a2e1a; border-left:3px solid #22c55e; font-size:.75rem; color:#86efac; }
.bubble.error { background:#422006; border-left:3px solid #ef4444; color:#fca5a5; font-size:.78rem; }
.bubble.assistant.streaming { opacity:.85; }
.bubble.system { background:#1e293b; border-left:3px solid #94a3b8; color:#94a3b8; font-size:.78rem; }
.text-row { display:flex; gap:.5rem; }
.text-row input { flex:1; padding:.7rem; border-radius:.5rem; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:.85rem; }
.text-row input:focus { outline:none; border-color:#6366f1; }
.text-row button { padding:.7rem 1.2rem; border:none; border-radius:.5rem; background:#6366f1; color:white; font-size:1rem; cursor:pointer; }
.text-row button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<div class="container">
  <h1>VoxPilot</h1>
  <p class="subtitle">AI Voice Support — WebRTC</p>

  <div class="auth-panel" id="authPanel">
    <input class="field" id="authName" placeholder="Your name (new account)">
    <input class="field" id="authEmail" placeholder="Email" autocomplete="username">
    <input class="field" id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <div class="auth-row">
      <button class="btn primary" id="loginBtn">Login</button>
      <button class="btn ghost" id="registerBtn">Create Account</button>
    </div>
    <p class="auth-msg" id="authMsg"></p>
  </div>

  <div id="mainPanel" style="display:none">
    <div class="user-row">
      <span class="user-label" id="userLabel"></span>
      <button class="btn ghost small" id="logoutBtn">Logout</button>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Disconnected</span>
    </div>

    <button class="mic-btn" id="micBtn">🎤</button>
    <p class="prompt" id="prompt">Click mic to start WebRTC voice chat</p>

    <div class="conversation" id="conversation"></div>

    <div class="text-row">
      <input type="text" id="textInput" placeholder="Or type your question...">
      <button id="sendBtn">▶</button>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const WS_BASE = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
const TOKEN_KEY = 'voxpilot_token';
const EMAIL_KEY = 'voxpilot_email';

let ws = null;
let pc = null;
let micStream = null;
let isMicActive = false;
let serverToken = '';
let responseTextEl = null;
let remoteAudioEl = null;

const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const promptEl = document.getElementById('prompt');
const conversation = document.getElementById('conversation');
const sendBtn = document.getElementById('sendBtn');
const authPanel = document.getElementById('authPanel');
const mainPanel = document.getElementById('mainPanel');
const authMsg = document.getElementById('authMsg');
const userLabel = document.getElementById('userLabel');

/* ---------- auth ---------- */

function decodeJwtPayload(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  } catch(e) { return {}; }
}

function isTokenExpired(token) {
  const p = decodeJwtPayload(token);
  return !p.exp || (p.exp * 1000) < Date.now();
}

let expiryTimer = null;
function scheduleExpiry() {
  if (expiryTimer) { clearTimeout(expiryTimer); expiryTimer = null; }
  const p = decodeJwtPayload(serverToken);
  if (p.exp) {
    const ms = p.exp * 1000 - Date.now() - 5000;
    if (ms > 0) {
      expiryTimer = setTimeout(() => logout('Session expired — please sign in again.'), ms);
    }
  }
}

function showAuth(msg) {
  mainPanel.style.display = 'none';
  authPanel.style.display = 'block';
  if (msg) authMsg.textContent = msg;
  disconnectSignaling();
}

function showMain() {
  authPanel.style.display = 'none';
  mainPanel.style.display = 'block';
  userLabel.textContent = 'Signed in as ' + (localStorage.getItem(EMAIL_KEY) || '');
}

function setAuthMsg(text) { authMsg.textContent = text || ''; }

async function api(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ('Request failed (' + res.status + ')'));
  return data;
}

async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthMsg('Enter email and password.'); return; }
  setAuthMsg(''); setButtonsBusy(true);
  try {
    const data = await api('/api/v1/auth/login', { email, password });
    onAuthed(data.access_token, email);
  } catch (e) { setAuthMsg(e.message); } finally { setButtonsBusy(false); }
}

async function doRegister() {
  const name = document.getElementById('authName').value.trim();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!name) { setAuthMsg('Enter your name to create an account.'); return; }
  if (!email || !password) { setAuthMsg('Enter email and password.'); return; }
  setAuthMsg(''); setButtonsBusy(true);
  try {
    const data = await api('/api/v1/auth/register', { name, email, password });
    onAuthed(data.access_token, email);
  } catch (e) { setAuthMsg(e.message); } finally { setButtonsBusy(false); }
}

function setButtonsBusy(busy) {
  document.getElementById('loginBtn').disabled = busy;
  document.getElementById('registerBtn').disabled = busy;
}

function onAuthed(token, email) {
  serverToken = token;
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(EMAIL_KEY, email);
  showMain();
  scheduleExpiry();
  connectSignaling();
}

function logout(msg) {
  serverToken = '';
  if (expiryTimer) { clearTimeout(expiryTimer); expiryTimer = null; }
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(EMAIL_KEY);
  showAuth(msg);
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('registerBtn').addEventListener('click', doRegister);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('authPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

/* ---------- status / bubbles ---------- */

function addBubble(role, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  b.textContent = text;
  conversation.appendChild(b);
  conversation.scrollTop = conversation.scrollHeight;
  return b;
}

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

/* ---------- signaling ---------- */

function connectSignaling() {
  if (!serverToken) return;
  if (ws && ws.readyState === WebSocket.OPEN) return;

  const url = `${WS_BASE}/api/v1/voice/webrtc?token=${encodeURIComponent(serverToken)}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus('connected', 'Connected — click mic to start');
    promptEl.textContent = 'Click mic to start WebRTC voice chat';
  };

  ws.onerror = () => {
    if (serverToken && isTokenExpired(serverToken)) {
      logout('Session expired — please sign in again.');
    } else {
      setStatus('error', 'Signaling failed');
      promptEl.textContent = 'Connection error';
    }
  };

  ws.onclose = (event) => {
    setStatus('disconnected', 'Disconnected');
    ws = null;
    if (isMicActive) stopMic();
    if (serverToken && isTokenExpired(serverToken)) {
      logout('Session expired — please sign in again.');
    }
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleMessage(data);
    } catch(e) {}
  };
}

function disconnectSignaling() {
  if (ws) { ws.onclose = null; try { ws.close(); } catch(e) {} ws = null; }
  if (isMicActive) stopMic();
}

function handleMessage(data) {
  switch(data.type) {
    case 'answer': handleAnswer(data.sdp); break;
    case 'ice_candidate': handleRemoteIce(data); break;
    case 'status': handleStatus(data.state); break;
    case 'transcript':
      addBubble('transcript', 'You: ' + data.text);
      if (responseTextEl) { responseTextEl.classList.remove('streaming'); responseTextEl = null; }
      break;
    case 'text_delta':
      if (!responseTextEl) {
        responseTextEl = addBubble('assistant', '');
        responseTextEl.classList.add('streaming');
      }
      responseTextEl.textContent += data.text;
      conversation.scrollTop = conversation.scrollHeight;
      break;
    case 'text_done':
      if (responseTextEl) responseTextEl.classList.remove('streaming');
      break;
    case 'tool_call': addBubble('tool', '🔧 ' + data.name); break;
    case 'error': addBubble('error', 'Error: ' + data.text); break;
  }
}

function handleStatus(state) {
  switch(state) {
    case 'listening': setStatus('listening', 'Listening...'); break;
    case 'processing': setStatus('processing', 'Thinking...'); break;
    case 'speaking': setStatus('speaking', 'Speaking...'); break;
    case 'idle': setStatus('idle', 'Connected'); break;
  }
}

/* ---------- webrtc ---------- */

async function handleAnswer(sdp) {
  if (!pc) return;
  try {
    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp }));
    addBubble('system', 'WebRTC media connected');
  } catch(e) {
    addBubble('error', 'Failed to set remote SDP: ' + e.message);
  }
}

async function handleRemoteIce(data) {
  if (!pc || !data.candidate) return;
  try {
    await pc.addIceCandidate(new RTCIceCandidate({
      candidate: data.candidate,
      sdpMid: data.sdpMid,
      sdpMLineIndex: data.sdpMLineIndex,
    }));
  } catch(e) {}
}

async function startMic() {
  if (!serverToken || isMicActive) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    promptEl.textContent = 'Connecting...';
    connectSignaling();
    await new Promise(r => setTimeout(r, 800));
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });

    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    micStream.getTracks().forEach(track => pc.addTrack(track, micStream));
    pc.addTransceiver('audio', { direction: 'recvonly' });

    pc.ontrack = (event) => {
      if (event.track.kind === 'audio' && event.streams[0]) {
        if (remoteAudioEl) { remoteAudioEl.remove(); }
        remoteAudioEl = document.createElement('audio');
        remoteAudioEl.srcObject = event.streams[0];
        remoteAudioEl.autoplay = true;
        remoteAudioEl.play().catch(() => {});
        document.body.appendChild(remoteAudioEl);
      }
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'ice_candidate',
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        }));
      }
    };

    pc.oniceconnectionstatechange = () => {
      const state = pc.iceConnectionState;
      if (state === 'disconnected' || state === 'failed') {
        addBubble('error', 'ICE connection ' + state);
        stopMic();
      }
    };

    const offer = await pc.createOffer({ offerToReceiveAudio: true });
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));

    isMicActive = true;
    micBtn.classList.add('active');
    micBtn.textContent = '⏹';
    setStatus('listening', 'Listening...');
    promptEl.textContent = 'Speak naturally — VAD detects when you\'re done';

  } catch(e) {
    promptEl.textContent = 'Microphone access denied';
    setStatus('error', 'Mic denied');
    isMicActive = false;
  }
}

function stopMic() {
  isMicActive = false;
  micBtn.classList.remove('active');
  micBtn.textContent = '🎤';

  if (pc) { pc.close(); pc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (remoteAudioEl) { remoteAudioEl.remove(); remoteAudioEl = null; }

  promptEl.textContent = 'Click mic to start again';
  setStatus('idle', 'Connected');
}

micBtn.addEventListener('click', () => {
  if (isMicActive) { stopMic(); } else { startMic(); }
});

/* ---------- text ---------- */

document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendText(); }
});
sendBtn.addEventListener('click', sendText);

async function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text || !serverToken) return;
  input.value = '';

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    connectSignaling();
    await new Promise(r => setTimeout(r, 500));
  }

  addBubble('user', '💬 ' + text);
  if (responseTextEl) { responseTextEl.classList.remove('streaming'); responseTextEl = null; }

  ws.send(JSON.stringify({ type: 'text_input', text: text }));
}

/* ---------- init ---------- */

(function init() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (token && !isTokenExpired(token)) {
    serverToken = token;
    showMain();
    scheduleExpiry();
    connectSignaling();
  } else {
    if (token) localStorage.removeItem(TOKEN_KEY);
    showAuth();
  }
})();
</script>
</body>
</html>
