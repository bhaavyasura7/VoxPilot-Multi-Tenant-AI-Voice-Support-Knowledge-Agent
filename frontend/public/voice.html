<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxPilot Voice Agent</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; justify-content:center; align-items:center; }
.container { width:100%; max-width:480px; padding:2rem; text-align:center; }
h1 { font-size:2rem; margin-bottom:.5rem; background:linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { color:#94a3b8; margin-bottom:1.5rem; }
.status-bar { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:1.5rem; }
.status-dot { width:12px; height:12px; border-radius:50%; background:#475569; flex-shrink:0; }
.status-dot.connected { background:#22c55e; }
.status-dot.listening { background:#3b82f6; animation:pulse .5s infinite; }
.status-dot.processing { background:#f59e0b; animation:pulse 1s infinite; }
.status-dot.speaking { background:#6366f1; }
.status-dot.error { background:#ef4444; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
.mic-btn { width:130px; height:130px; border-radius:50%; border:none; background:linear-gradient(135deg,#6366f1,#a855f7); color:white; font-size:2.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem; box-shadow:0 4px 30px rgba(99,102,241,.3); user-select:none; }
.mic-btn:active { transform:scale(1.1); }
.mic-btn.recording { background:linear-gradient(135deg,#ef4444,#dc2626); animation:pulse .8s infinite; }
.mic-btn:disabled { opacity:.3; cursor:not-allowed; }
.prompt { color:#94a3b8; font-size:.85rem; margin-bottom:1rem; height:1.2rem; }
.token-input { padding:.75rem; border-radius:.5rem; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:.9rem; width:100%; margin-bottom:.75rem; }
.token-input:focus { outline:none; border-color:#6366f1; }
.conversation { text-align:left; max-height:250px; overflow-y:auto; }
.bubble { padding:.6rem .8rem; border-radius:.5rem; margin:.4rem 0; font-size:.88rem; }
.bubble.user { background:#334155; }
.bubble.assistant { background:#1e3a5f; border-left:3px solid #6366f1; }
.bubble.warning { background:#422006; border-left:3px solid #f59e0b; color:#fcd34d; font-size:.8rem; }
</style>
</head>
<body>
<div class="container">
  <h1>VoxPilot</h1>
  <p class="subtitle">AI Voice Support Agent</p>

  <input class="token-input" id="tokenInput" placeholder="Paste JWT access token here...">

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Disconnected</span>
  </div>

  <button class="mic-btn" id="micBtn" disabled>
    🎤
  </button>
  <p class="prompt" id="prompt"></p>

  <div class="conversation" id="conversation"></div>

  <div style="display:flex;gap:.5rem;margin-top:1rem;">
    <input type="text" id="textInput" class="token-input" placeholder="Or type your question here..." style="flex:1;margin:0;">
    <button id="sendBtn" onclick="sendText()" style="padding:.75rem 1.25rem;border:none;border-radius:.5rem;background:#6366f1;color:white;font-size:1rem;cursor:pointer;">▶</button>
  </div>
</div>

<script>
let ws = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordStartTime = 0;
let isProcessing = false;
let serverToken = '';

const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const prompt = document.getElementById('prompt');
const tokenInput = document.getElementById('tokenInput');
const conversation = document.getElementById('conversation');

tokenInput.addEventListener('input', () => {
  serverToken = tokenInput.value.trim().replace(/^["']|["']$/g, '');
  micBtn.disabled = !serverToken;
  document.getElementById('sendBtn').disabled = !serverToken;
});

tokenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    connectWS();
  }
});

document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    sendText();
  }
});

document.getElementById('sendBtn').disabled = true;

function addBubble(role, text) {
  const b = document.createElement('div');
  b.className = `bubble ${role}`;
  b.textContent = text;
  conversation.appendChild(b);
  conversation.scrollTop = conversation.scrollHeight;
}

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

async function connectWS() {
  if (!serverToken) return;
  if (ws && ws.readyState === WebSocket.OPEN) return;

  const url = `ws://localhost:8000/api/v1/voice/realtime?token=${encodeURIComponent(serverToken)}`;
  ws = new WebSocket(url);

  return new Promise((resolve) => {
    ws.onopen = () => {
      setStatus('connected', 'Connected — hold mic to speak');
      prompt.textContent = 'Hold the mic button and speak your question';
      resolve();
    };
    ws.onerror = () => { setStatus('error', 'Connection failed'); };
    ws.onclose = () => { setStatus('disconnected', 'Disconnected'); ws = null; };
    
    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        try {
          const data = JSON.parse(event.data);
          switch(data.type) {
            case 'warning':
              addBubble('warning', data.text);
              break;
            case 'transcript':
              addBubble('user', '🎙 ' + data.text);
              setStatus('processing', 'Thinking...');
              prompt.textContent = 'Generating response...';
              break;
            case 'answer':
              addBubble('assistant', data.text);
              setStatus('speaking', 'Speaking...');
              prompt.textContent = '';
              isProcessing = false;
              break;
            case 'error':
              addBubble('warning', '⚠ ' + data.text);
              setStatus('connected', 'Connected');
              prompt.textContent = 'Try again — hold and speak';
              isProcessing = false;
              break;
          }
        } catch(e) {}
      } else {
        playAudio(event.data);
      }
    };
  });
}

async function playAudio(blob) {
  try {
    const arrayBuffer = blob instanceof Blob ? await blob.arrayBuffer() : blob;
    const ctx = new AudioContext({sampleRate: 24000});
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    const src = ctx.createBufferSource();
    src.buffer = audioBuffer;
    src.connect(ctx.destination);
    src.onended = () => {
      ctx.close();
      setStatus('connected', 'Connected');
      prompt.textContent = 'Hold mic to ask another question';
    };
    src.start();
  } catch(e) {
    setStatus('connected', 'Connected');
    prompt.textContent = 'Hold mic to ask another question';
  }
}

micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });

micBtn.addEventListener('mouseup', stopAndSend);
micBtn.addEventListener('touchend', stopAndSend);
micBtn.addEventListener('mouseleave', stopAndSend);

async function startRecording() {
  if (!serverToken || isProcessing) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    prompt.textContent = 'Connecting...';
    await connectWS();
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    audioChunks = [];
    
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length === 0 || isProcessing) return;
      isProcessing = true;
      
      const duration = (Date.now() - recordStartTime) / 1000;
      if (duration < 0.8) {
        prompt.textContent = 'Too short — hold longer and speak clearly';
        setTimeout(() => { prompt.textContent = 'Hold mic to ask another question'; }, 2500);
        isProcessing = false;
        return;
      }
      
      setStatus('processing', 'Transcribing...');
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      const buf = await blob.arrayBuffer();
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(buf);
      }
    };
    
    mediaRecorder.start();
    recordStartTime = Date.now();
    isRecording = true;
    micBtn.classList.add('recording');
    setStatus('listening', 'Listening...');
    prompt.textContent = 'Speak now — release when done';
    
  } catch(e) {
    prompt.textContent = 'Microphone access denied';
    setStatus('error', 'Mic denied');
  }
}

function stopAndSend() {
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

async function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text || !serverToken || isProcessing) return;
  input.value = '';
  
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    await connectWS();
  }
  
  isProcessing = true;
  addBubble('user', '💬 ' + text);
  setStatus('processing', 'Thinking...');
  
  ws.send(JSON.stringify({action: 'text_query', query: text}));
}
</script>
</body>
</html>
